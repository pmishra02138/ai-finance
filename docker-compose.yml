services:
  app:
    build: .
    container_name: ai-finance
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/app/data
      - ./output:/data
    environment:
      - AI_FINANCE_DB_PATH=/app/data/ai_finance.db
    restart: unless-stopped

  cli:
    build: .
    profiles: ["cli"]
    entrypoint: ["uv", "run", "--no-sync", "python", "/app/scripts/generate_finance_pdf.py"]
    volumes:
      - ./output:/data
    working_dir: /data
