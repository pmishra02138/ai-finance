services:
  api:
    build: .
    container_name: ai-finance-api
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/app/data
      - ./output:/data
    environment:
      - AI_FINANCE_DB_PATH=/app/data/ai_finance.db
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ai-finance-frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - BACKEND_URL=http://api:8787
    depends_on:
      - api
    restart: unless-stopped

  cli:
    build: .
    profiles: ["cli"]
    entrypoint: ["uv", "run", "--no-sync", "python", "/app/scripts/generate_finance_pdf.py"]
    volumes:
      - ./output:/data
    working_dir: /data
