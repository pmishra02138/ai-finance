<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 225" width="900" height="225" role="img" aria-label="AI Personal Finance Advisor">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111e"/>
      <stop offset="55%" stop-color="#0d1e33"/>
      <stop offset="100%" stop-color="#0a292b"/>
    </linearGradient>
    <radialGradient id="glowEmerald" cx="0.82" cy="0.35" r="0.45">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="0.15" cy="0.75" r="0.4">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Base & Ambient Glows -->
  <rect width="900" height="225" rx="12" fill="url(#bgGrad)"/>
  <rect width="900" height="225" rx="12" fill="url(#glowEmerald)"/>
  <rect width="900" height="225" rx="12" fill="url(#glowGold)"/>
  <rect x="0.5" y="0.5" width="899" height="224" rx="12" fill="none" stroke="#1e3a5f" stroke-opacity="0.7"/>

  <!-- Subtle architectural grid -->
  <g stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="56" x2="900" y2="56"/>
    <line x1="0" y1="112" x2="900" y2="112"/>
    <line x1="0" y1="168" x2="900" y2="168"/>
    <line x1="225" y1="0" x2="225" y2="225"/>
    <line x1="450" y1="0" x2="450" y2="225"/>
    <line x1="675" y1="0" x2="675" y2="225"/>
  </g>

  <!-- Left Accent Bar -->
  <rect x="34" y="34" width="5" height="157" rx="2.5" fill="url(#accentBar)"/>

  <!-- Main Title & Subtitle -->
  <text x="54" y="76" class="sans" font-size="36" font-weight="800" letter-spacing="-0.4" fill="url(#titleGrad)">AI Personal Finance</text>
  <text x="54" y="112" class="sans" font-size="26" font-weight="700" letter-spacing="1.8" fill="#fbbf24">ADVISOR</text>
  <text x="54" y="142" class="sans" font-size="13.5" font-weight="500" fill="#cbd5e1">5-Stage Guided Planning  •  SQLite Persistence  •  9-Page PDF Reports</text>

  <!-- Bottom 5-Stage Chips -->
  <g transform="translate(54, 164)" class="sans" font-size="10.5" font-weight="600">
    <rect x="0" y="0" width="76" height="20" rx="5" fill="#13263d" stroke="#334155" stroke-width="1"/>
    <text x="38" y="13.5" text-anchor="middle" fill="#93c5fd">1. Baseline</text>

    <rect x="84" y="0" width="90" height="20" rx="5" fill="#13263d" stroke="#334155" stroke-width="1"/>
    <text x="129" y="13.5" text-anchor="middle" fill="#6ee7b7">2. Foundation</text>

    <rect x="182" y="0" width="74" height="20" rx="5" fill="#13263d" stroke="#334155" stroke-width="1"/>
    <text x="219" y="13.5" text-anchor="middle" fill="#fde68a">3. Growth</text>

    <rect x="264" y="0" width="80" height="20" rx="5" fill="#13263d" stroke="#334155" stroke-width="1"/>
    <text x="304" y="13.5" text-anchor="middle" fill="#c4b5fd">4. Horizons</text>

    <rect x="352" y="0" width="76" height="20" rx="5" fill="#13263d" stroke="#334155" stroke-width="1"/>
    <text x="390" y="13.5" text-anchor="middle" fill="#fda4af">5. Export</text>
  </g>

  <!-- Right Glassmorphic Dashboard Card -->
  <g transform="translate(570, 24)">
    <rect x="0" y="0" width="296" height="177" rx="12" fill="#091526" fill-opacity="0.88" stroke="#1e3a5f" stroke-width="1.2"/>

    <!-- Card Header -->
    <text x="16" y="23" class="sans" font-size="10" font-weight="700" letter-spacing="1" fill="#94a3b8">FINANCIAL HEALTH SCORE</text>
    <rect x="226" y="11" width="54" height="18" rx="9" fill="#064e3b" stroke="#10b981" stroke-opacity="0.5"/>
    <text x="253" y="23" class="sans" font-size="10" font-weight="700" text-anchor="middle" fill="#34d399">GRADE A</text>

    <!-- Score Ring -->
    <g transform="translate(56, 76)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#1e293b" stroke-width="7"/>
      <circle cx="0" cy="0" r="32" fill="none" stroke="url(#ringGrad)" stroke-width="7"
              stroke-linecap="round" stroke-dasharray="176 201" transform="rotate(-90)"/>
      <text x="0" y="4" class="sans" font-size="22" font-weight="800" text-anchor="middle" fill="#ffffff">92</text>
      <text x="0" y="17" class="sans" font-size="9" font-weight="600" text-anchor="middle" fill="#94a3b8">/ 100</text>
    </g>

    <!-- Growth Sparkline -->
    <g transform="translate(110, 42)">
      <text x="0" y="10" class="sans" font-size="10" font-weight="600" fill="#cbd5e1">Net Worth &amp; FIRE Trajectory</text>
      <path d="M 0 58 L 28 50 L 56 44 L 84 31 L 112 24 L 140 12 L 166 4 L 166 64 L 0 64 Z" fill="url(#areaGrad)"/>
      <path d="M 0 58 L 28 50 L 56 44 L 84 31 L 112 24 L 140 12 L 166 4" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="166" cy="4" r="3.5" fill="#fbbf24"/>
    </g>

    <!-- Bottom Mini Pillar Bars -->
    <g transform="translate(16, 128)" class="sans" font-size="9.5" font-weight="600" fill="#cbd5e1">
      <text x="0" y="10">Cash Flow</text>
      <rect x="64" y="3" width="84" height="6" rx="3" fill="#1e293b"/>
      <rect x="64" y="3" width="76" height="6" rx="3" fill="#34d399"/>

      <text x="0" y="25">Debt &amp; Risk</text>
      <rect x="64" y="18" width="84" height="6" rx="3" fill="#1e293b"/>
      <rect x="64" y="18" width="68" height="6" rx="3" fill="#38bdf8"/>

      <text x="0" y="40">Retirement</text>
      <rect x="64" y="33" width="84" height="6" rx="3" fill="#1e293b"/>
      <rect x="64" y="33" width="79" height="6" rx="3" fill="#fbbf24"/>

      <!-- Right mini stat -->
      <rect x="164" y="2" width="100" height="39" rx="7" fill="#0f2238" stroke="#1e3a5f"/>
      <text x="214" y="18" text-anchor="middle" font-size="9" fill="#94a3b8">9-PAGE REPORT</text>
      <text x="214" y="32" text-anchor="middle" font-size="11" font-weight="700" fill="#e2e8f0">FINANCE-PLAN.pdf</text>
    </g>
  </g>
</svg>
